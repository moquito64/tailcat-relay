# Project name is fixed so the named volumes (Let's Encrypt cache, derper.key,
# tailcat server key) survive re-clones and directory moves.
name: tailcat

services:
  derper:
    image: ghcr.io/moquito64/tailwag-derper:${TAILSCALE_VERSION}
    container_name: derper
    restart: unless-stopped
    # host networking: derper/STUN want the real client source IP:port and
    # bind 80/443/3478 themselves. Fine here since this VM does nothing else.
    network_mode: host
    volumes:
      - derper-state:/var/lib/derper
    command:
      - --hostname=${DERP_HOSTNAME}        # A record -> the GCP static IP; Let's Encrypt validates this
      - --certmode=letsencrypt
      - --certdir=/var/lib/derper/certs
      - --c=/var/lib/derper/derper.key     # persisted, or it regenerates on every recreate
      - --a=:443
      - --http-port=80
      - --stun-port=3478
      - --stun=true
      - --derp=true
      # tailcat peers aren't tailnet nodes, so there's nothing to verify against;
      # the gate is --allow=nodekey:... on each tailwag server. DERP only sees
      # WireGuard-encrypted packets.
      - --verify-clients=false

  # The relay VM's own break-glass: forwards this VM's real sshd (normal SSH
  # auth still applies) through a tailcat tunnel rendezvousing on our relay.
  tailcat:
    image: ghcr.io/tailscale/tailcat:${TAILCAT_VERSION}
    container_name: tailcat
    restart: unless-stopped
    depends_on: [derper]
    network_mode: host                     # so "serve 22" reaches localhost:22
    volumes:
      - tailcat-state:/home/nonroot        # saved key (~/.config/tailcat) + derpmap cache
    command: ["serve", "22"]               # uses saved key "default" from init-key.sh

volumes:
  derper-state:
  tailcat-state:
