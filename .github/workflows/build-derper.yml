name: build tailcat-relay

on:
  push:
    branches: [main]
    paths: ["docker/Dockerfile", "docker/.env", ".github/workflows/build-derper.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned derper version from docker/.env
        id: v
        run: echo "tailscale=$(sed -n 's/^TAILSCALE_VERSION=//p' docker/.env)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./docker
          push: true
          build-args: TAILSCALE_VERSION=${{ steps.v.outputs.tailscale }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tailcat-relay:${{ steps.v.outputs.tailscale }}
            ghcr.io/${{ github.repository_owner }}/tailcat-relay:latest

# The package must stay public: the VM's startup script pulls anonymously.
